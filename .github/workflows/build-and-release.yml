name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (for example: v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Create as a prerelease"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      - name: Install Wails
        shell: pwsh
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install frontend dependencies
        working-directory: gui/frontend
        run: npm ci

      - name: Build GUI
        working-directory: gui
        run: wails build -platform windows/amd64 -trimpath -clean

      - name: Build CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $env:CGO_ENABLED = "0"
          go build -ldflags "-s -w" -o dist/sni-spoofing-windows-amd64.exe .

      - name: Prepare release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item gui/build/bin/sni-spoofing-gui.exe dist/sni-spoofing-gui-windows-amd64.exe
          Get-FileHash dist/*.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Set-Content dist/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists."
            exit 1
          fi

          gh release create "${VERSION}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "SNI Spoofing ${VERSION}" \
            --generate-notes \
            $(if [ "${PRERELEASE}" = "true" ]; then echo "--prerelease"; fi)
